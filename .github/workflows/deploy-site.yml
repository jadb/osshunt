name: deploy-site

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/collections/**', 'lib/**', '.github/workflows/deploy-site.yml']
  pull_request:
    paths: ['site/**', 'data/collections/**', 'lib/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork PRs get no secrets; only same-repo PRs and main deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Deploy production (main)
        if: github.event_name != 'pull_request'
        working-directory: site
        run: npx --yes wrangler@4.148.0 deploy
      - name: Upload preview version (pull request)
        if: github.event_name == 'pull_request'
        working-directory: site
        run: npx --yes wrangler@4.148.0 versions upload --tag "pr-${{ github.event.pull_request.number }}" --message "PR ${{ github.event.pull_request.number }}"
